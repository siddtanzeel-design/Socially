[project]
name = "socially"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tanzeel Siddiqui", email = "siddtanzeel@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.151.0",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "imagekitio==4.1.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
socially = "socially:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
